id = "zumik3-del/opencode-go-usage"
name = "Opencode Go Usage"
version = "1.0.0"
plugin_api = 3
author = "zumik3-del"
license = "MIT"
description = "Shows Opencode Go AI coding assistant usage limits"
tags = ["Bar", "Productivity", "AI"]
dependencies = ["curl"]

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "bar_limit"
  type = "select"
  label_key = "settings.bar_limit.label"
  description_key = "settings.bar_limit.description"
  default = "5h"
  options = [
    { value = "5h", label_key = "settings.bar_limit.5h" },
    { value = "week", label_key = "settings.bar_limit.week" },
    { value = "month", label_key = "settings.bar_limit.month" },
  ]

  [[widget.setting]]
  key = "refresh_interval_sec"
  type = "number"
  label_key = "settings.refresh_interval.label"
  description_key = "settings.refresh_interval.description"
  default = 1800
  min = 60
  max = 86400

[[panel]]
id = "panel"
entry = "panel.luau"
width = 400
height = 320
placement = "attached"
position = "auto"
open_near_click = true

[[service]]
id = "usage"
entry = "service.luau"

[[setting]]
key = "api_key"
type = "string"
label_key = "settings.api_key.label"
description_key = "settings.api_key.description"
default = ""
sensitive = true

[[setting]]
key = "refresh_interval_sec"
type = "number"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 1800
min = 60
max = 86400
